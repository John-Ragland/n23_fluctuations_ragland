name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - pytest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3
  SUBMODULE_PATH: projects/n23_fluctuations_ragland

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  tests:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]

    steps:
      - name: Check out NESCAFE23 parent workspace
        uses: actions/checkout@v6
        with:
          repository: John-Ragland/NESCAFE23
          ref: main
          submodules: false
          path: workspace

      - name: Remove empty submodule placeholder
        run: rm -rf workspace/${{ env.SUBMODULE_PATH }}

      - name: Check out this submodule's PR code into workspace path
        uses: actions/checkout@v6
        with:
          path: workspace/${{ env.SUBMODULE_PATH }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync workspace (only populated submodule resolves)
        working-directory: workspace
        run: uv sync --all-packages

      - name: Run tests from workspace root
        working-directory: workspace
        run: uv run pytest -ra --durations=20
