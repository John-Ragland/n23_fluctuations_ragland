[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "n23_fluctuations_ragland"
authors = [
  { name = "John Ragland", email = "jragland96@gmail.com" },
]
description = "Code supporting the analysis of acoustic fluctuations of intensity and phase for the NESCAFE 2023 acoustic tomography experiment."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "nescafe23",
  "pygenray",
  "questionary",
  "cmocean",
  "seaborn",
  "geopy",
  "panel",
]

[tool.uv.sources]
nescafe23 = { workspace = true }
pygenray = { git = "https://github.com/John-Ragland/pygenray", branch = "main" }

[project.scripts]
n23_fluctuation_analysis = "n23_fluctuations_ragland.cli:main"
n23_panel = "n23_fluctuations_ragland.cli:serve_panel_apps"

[project.urls]
Homepage = "https://github.com/John-Ragland/NESCAFE23_fluctuations"
"Bug Tracker" = "https://github.com/John-Ragland/NESCAFE23_fluctuations/issues"
Discussions = "https://github.com/John-Ragland/NESCAFE23_fluctuations/discussions"
Changelog = "https://github.com/John-Ragland/NESCAFE23_fluctuations/releases"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
]
dev = [
  { include-group = "test" },
  "nbstripout",
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]


[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/n23_fluctuations_ragland/_version.py"


[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--import-mode=importlib"]
strict_markers = true
filterwarnings = [
  "error",
  "ignore::pytest.PytestConfigWarning",
]
log_level = "INFO"
testpaths = ["tests"]


[tool.coverage]
run.source = ["n23_fluctuations_ragland"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]


[tool.ruff]
extend-exclude = ["notebooks", "dev", "panel_apps", "src/archive.py", "*.ipynb"]

[tool.ruff.lint]
extend-select = [
  "B",    # flake8-bugbear
  "I",    # isort
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific rules
  "NPY",  # numpy-specific
  "PD",   # pandas-vet
  "PT",   # flake8-pytest-style
  "PTH",  # flake8-use-pathlib
]
ignore = ["RUF059"]
