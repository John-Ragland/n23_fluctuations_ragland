[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "n23_fluctuations_ragland"
authors = [
  { name = "John Ragland", email = "jragland96@gmail.com" },
]
description = "Code supporting the analysis of acoustic fluctuations of intensity and phase for the NESCAFE 2023 acoustic tomography experiment."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "nescafe23",
  "pygenray",
  "questionary",
  "cmocean",
  "seaborn",
  "geopy",
  "panel",
]

[tool.uv.sources]
nescafe23 = { workspace = true }
pygenray = { git = "https://github.com/John-Ragland/pygenray", branch = "main" }

[project.scripts]
n23_fluctuation_analysis = "n23_fluctuations_ragland.cli:main"
n23_panel = "n23_fluctuations_ragland.cli:serve_panel_apps"

[project.urls]
Homepage = "https://github.com/John-Ragland/NESCAFE23_fluctuations"
"Bug Tracker" = "https://github.com/John-Ragland/NESCAFE23_fluctuations/issues"
Discussions = "https://github.com/John-Ragland/NESCAFE23_fluctuations/discussions"
Changelog = "https://github.com/John-Ragland/NESCAFE23_fluctuations/releases"


[dependency-groups]
test = [
  "pytest >=9",
  "pytest-cov >=7",
]
dev = [
  { include-group = "test" },
  "ruff",
  "pre-commit",
  "nbstripout"
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]


[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/n23_fluctuations_ragland/_version.py"

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
env-vars.PYTHONWARNDEFAULTENCODING = "1"


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals"]
strict = true
filterwarnings = [
  "error",
]
log_level = "INFO"
testpaths = [
  "tests",
]


[tool.coverage]
run.source = ["n23_fluctuations_ragland"]
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
]

[tool.mypy]
files = ["src", "tests"]
python_version = "3.10"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "n23_fluctuations_ragland.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true


[tool.ruff]
line-length = 88
exclude = ["*.ipynb"]

[tool.ruff.format]
# Enable preview style for better wrapping
preview = true

[tool.ruff.lint]
extend-select = [
  "B",      # flake8-bugbear
  "I",      # isort
  "RUF",    # Ruff-specific
  "UP",     # pyupgrade
]

ignore = [
  "B007", # loop control variable not used
  "F841", # local variable assigned but never used
  "B008", # function call in a loop
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"noxfile.py" = ["T20"]
"notebooks/**" = ["T20", "E402"]

[tool.pylint]
py-version = "3.10"
ignore-paths = [".*/_version.py"]
reports.output-format = "colorized"
similarities.ignore-imports = "yes"
messages_control.disable = [
  "design",
  "fixme",
  "line-too-long",
  "missing-module-docstring",
  "missing-function-docstring",
  "wrong-import-position",
  # Scientific Python naming: math variables (N, H, J, Phi2, F_phi, etc.) are intentional
  "invalid-name",
  # NumPy false positives: None-as-axis indexing (dmodf[:, :, None]) and dynamic members (finfo.eps)
  "invalid-sequence-index",
  "no-member",
  # NumPy return-type inference: np.unravel_index shape is not statically known
  "unbalanced-tuple-unpacking",
  # Acceptable in scientific analysis code with many similar computations
  "duplicate-code",
  # Large module is acceptable for this codebase
  "too-many-lines",
  # Minor style issues not worth enforcing
  "redefined-outer-name",
  "unused-variable",
  "unused-argument",
  "redefined-argument-from-local",
  "no-else-return",
  "consider-using-dict-items",
  "useless-return",
  "consider-using-enumerate",
  # Intentional patterns in cli.py
  "broad-exception-caught",
  "import-outside-toplevel",
]
